[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slicegate"
version = "0.3.0"
description = "Gated development process for teams of AI coding agents: slices, gates, verdict ledgers, guards in git hooks, mutation testing by risk zone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nguyễn Cường"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "claude-code", "quality-gates", "mutation-testing", "governance", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/cuongnpv-create/slicegate"
Repository = "https://github.com/cuongnpv-create/slicegate"
Issues = "https://github.com/cuongnpv-create/slicegate/issues"

[project.scripts]
slicegate = "slicegate.cli:main"
gatekit = "slicegate.cli:legacy_main"   # tên cũ — hook git của dự án cài trước 0.3.0 gọi lệnh này

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slicegate = ["templates/**/*", "packs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
