[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicegate"
version = "0.3.0"
description = "Quy trình phát triển phần mềm có cổng duyệt (gate) cho đội agent AI — lát, sổ phán, máy gác, đột biến theo vùng rủi ro."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slicegate = "slicegate.cli:main"
gatekit = "slicegate.cli:legacy_main"   # tên cũ — hook git của dự án cài trước 0.3.0 gọi lệnh này

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slicegate = ["templates/**/*", "packs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
